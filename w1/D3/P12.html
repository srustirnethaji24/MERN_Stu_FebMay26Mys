<!DOCTYPE html>
<html lang="en">
<head>

    <title>Completed Box model</title>
    <style>
        .product-card{
            display:inline-block;

     <div class="product-card padding-medium">
        <h4>Medium padding</h4>

     <div class="product-card padding-large">

        <p>70% off!!!</p>
    </div>

</html>

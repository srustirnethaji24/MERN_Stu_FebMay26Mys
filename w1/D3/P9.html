<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child and Descendant Selector</title>
    <style>
        /* Child Selector */
        div >p{
            color:hotpink;
            font-weight: bold;
        }
        /* Descendant Selector */
        div span{
            color: brown;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div>
        <p> Direct Child</p>
        <section>
            <p>This is not a Direct Child </p>
        </section>
        <span>
            This Span is Inside a div tag
        </span>
        <div><span> Nested span tag</span></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Selectors</title>
    <style>
        .paraType1{
            background-color: aqua;
            font-weight: bold;
        }
        .paraType2{
            color: blue;
        }
        /*ID selector*/
        #main-title{
            text-decoration: underline;
        }
       </style>
</head>       
</body>
    <!--Class selector-->
    <p class="paraType1"> This is paragraph </p>
    <p class="paraType2"> This is paragraph2 </p>

    <!-- ID selector-->
     <h1 id="main-title">main heading</h1>
</body>    
</html>

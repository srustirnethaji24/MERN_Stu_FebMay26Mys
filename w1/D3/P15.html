<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex layout</title>
    <style>
        .flex-container{
            display: flex;
            background-color: rgb(23, 119, 108);
            justify-content: space-evenly;
            /* space-around/flex-start/flex-end/center/space-between/space-evenly*/
            /*justify-content: space-evenly;*/
            /* align center is used for vertical-align/center/flex-start/flex-end*/
            align-items: baseline;
            height: 100px;
            flex-direction: column-reverse;/*row-reverse/row/column/column-reverse*/
            flex-wrap:wrap-reverse;/*wrap/nowrap/rap-reverse*/
        }
        .flex-item{
            background-color: rgb(30, 135, 161);
            margin: 10px;
            padding: 20px;
            width: 100px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Display:flex</h1>
    <div class="flex-container">
        <div class="flex-item">content 1</div>
        <div class="flex-item">content 2</div>
        <div class="flex-item">content 3</div>
    </div>
</body>
</html>

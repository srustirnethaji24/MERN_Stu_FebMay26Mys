<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <!--Learning more HTML Tables Features --> 
   <table border="1">
    <!-- Provide description for screen readers-->
    <p id="Table Description">This table list Stuednt Scores.</p>
    <caption> Scores of Stuednt</caption>
    <colgroup>
        <col span="1">
        <col span="3">
    </colgroup>
    <thead>
        <tr>
            <th rowspan="2">Name</th>
            <th colspan="2">Subjects</th>
            <th rowspan="2">Total Marks</th>
        </tr>
        <tr>
            <th>Math</th>
            <th>Science</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Lokesh</td>
            <td>80</td>
            <td>80</td>
            <td>160</td>
        </tr>
         <tr>
            <td>Krishna</td>
            <td>60</td>
            <td>60</td>
            <td>120</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3">Avg. score</td>
            <td>140</td>
        </tr>
    </tfoot>
   </table>
</body>
</html>

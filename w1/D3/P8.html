<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal selector & Grouping selector</title>
    <style>
        /* Universal Selector */
        *{
            color: red;
            margin:0;
            padding:0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        /*grouping selector*/
        h1,h3{
            color: blue;
        }
    </style>
</head>
<body>
    <h2>All Elements have Zero margin and Zero padding </h2>
    <p>Paragraph 1</p>
    <h1>Srusti R N</h1>
    <h3>Spoorthi R N</h3>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>House Design</title>
    <style>
        .roof {
            top: 100px;
            left: 500px;
            width: 300px;
            height: 50px;
            background-color: rgb(255, 60, 0);
            border: 4px solid black;
            position: relative;
        }
        .house {
            top: 100px;
            left: 525px;
            width: 250px;
            height: 300px;
            background-color: green;
            border: 4px solid black;
            position: relative;   
        }
        .window1 {
            top: 40px;
            left: 30px;
            width: 60px;
            height: 80px;
            background-color: blueviolet;
            border: 4px solid black;
            position: relative;  
        }
        .window2 {
            top: -40px;
            left: 150px;
            width: 60px;
            height: 80px;
            background-color: rgb(206, 20, 206);
            border: 4px solid black;
            position: relative;
        }
        .door {
            top: 20px;
            left: 100px;
            width: 70px;
            height: 100px;
            background-color: steelblue;
            border: 4px solid black;
            position: relative;   
        }
         body {
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="roof"></div>
    <div class="house">
        <div class="window1"></div>
        <div class="window2"></div>
        <div class="door"></div>
    </div>

</body>
</html>

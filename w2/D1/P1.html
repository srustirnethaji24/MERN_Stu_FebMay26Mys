<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positioning elements:static</title>
    <style>
    .box{
        position:static;
        width: 150px;
        height: 100px;
        border: 5px solid black;
        background-color: aqua;
        border-radius: 10px;
        box-shadow: 10px 4px black; 
        text-align: center;   
        margin: 10px; 
        color: red; 
    }
    body{
        background-color: blueviolet;
    }
    </style>
</head>
<body>
    <h2>Static position</h2>
    <div class="box">static box</div>
</body>
</html>
